<style id="castrol-ultra-premium">
/* =========================================================
   CASTROL ULTRA PREMIUM UI - ENHANCEMENT
   ========================================================= */
:root {
  --up-green-dark: #004d30;
  --up-green-main: #007b4d;
  --up-green-light: #00a651;
  --up-gold: #d4af37;
  --up-glass: rgba(255, 255, 255, 0.85);
  --up-glass-border: rgba(255, 255, 255, 0.5);
}

body {
    background: linear-gradient(135deg, #eef4f0 0%, #f4f8f5 100%) !important;
    font-family: 'Inter', sans-serif !important;
}

/* Header Premium */
#mainHeader {
    background: linear-gradient(120deg, #022b1a 0%, #005f3c 50%, #008957 100%) !important;
    border-bottom: 2px solid var(--up-gold) !important;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15) !important;
}

#mainHeader h1 {
    font-weight: 900 !important;
    letter-spacing: 1px !important;
    text-shadow: 0 2px 5px rgba(0,0,0,0.3) !important;
}

/* Sidebar Glassmorphism */
#leftNav.app-sidebar {
    background: var(--up-glass) !important;
    backdrop-filter: blur(24px) !important;
    -webkit-backdrop-filter: blur(24px) !important;
    border-right: 1px solid var(--up-glass-border) !important;
    box-shadow: 5px 0 25px rgba(0, 45, 25, 0.05) !important;
}

/* Premium Cards */
.bg-white.border, .rounded-xl.bg-slate-50, .riwayat-card, .modern-modal-card {
    background: rgba(255, 255, 255, 0.95) !important;
    backdrop-filter: blur(10px) !important;
    border: 1px solid rgba(255, 255, 255, 0.8) !important;
    border-radius: 20px !important;
    box-shadow: 0 12px 35px rgba(0, 45, 25, 0.06) !important;
    transition: transform 0.3s ease, box-shadow 0.3s ease !important;
}

.bg-white.border:hover, .riwayat-card:hover {
    transform: translateY(-3px) !important;
    box-shadow: 0 18px 45px rgba(0, 45, 25, 0.1) !important;
}

/* Buttons */
